name: Build

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON 2>&1 | tee configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
      - name: Smoke test Linux build
        run: xvfb-run -a python3 .github/scripts/smoke_test.py build/build
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Upload Linux logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-linux-logs
          path: |
            configure.log
            build.log
            smoke-test.log
          if-no-files-found: ignore
      - name: Prepare Linux artifact
        run: |
          mkdir -p dist/src
          cp -R src/shaders dist/src/
          cp build/build dist/learnopengl
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-linux
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON 2>&1 | tee configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
      - name: Smoke test macOS build
        run: python3 .github/scripts/smoke_test.py build/build
      - name: Upload macOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-macos-logs
          path: |
            configure.log
            build.log
            smoke-test.log
          if-no-files-found: ignore
      - name: Prepare macOS artifact
        run: |
          mkdir -p dist/src
          cp -R src/shaders dist/src/
          cp build/build dist/learnopengl
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-macos
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DLEARNOPENGL_FETCH_STATIC_GLFW=ON 2>&1 | tee configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
      - name: Smoke test Windows build
        run: python .github/scripts/smoke_test.py build/build.exe
      - name: Upload Windows logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-windows-logs
          path: |
            configure.log
            build.log
            smoke-test.log
          if-no-files-found: ignore
      - name: Prepare Windows artifact
        run: |
          mkdir -p dist/src
          cp -R src/shaders dist/src/
          cp build/build.exe dist/learnopengl.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-windows
          path: dist/
          if-no-files-found: error
