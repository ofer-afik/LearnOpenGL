name: Build

on: push

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Package Linux application
        run: |
          mkdir -p package/src
          cp build/build package/build
          cp -R src/assets/textures package/src
          cp -R src/asssets/shaders package/src/
      - name: Upload Linux application
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-linux
          path: package/
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Package macOS application
        run: |
          mkdir -p package/src
          cp build/build package/build
          cp -R src/assets/textures package/src
          cp -R src/assets/shaders package/src/
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-macos
          path: package/
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DLEARNOPENGL_FETCH_STATIC_GLFW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Package Windows application
        run: |
          mkdir -p package/src
          cp build/build.exe package/build.exe
          cp -R src/assets/textures package/src
          cp -R src/assets/shaders package/src/
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-windows
          path: package/
          if-no-files-found: error
