name: Build

on: push

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure
        run: cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-linux
          path: build/build
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-macos
          path: build/build
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DLEARNOPENGL_FETCH_STATIC_GLFW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-windows
          path: build/build.exe
          if-no-files-found: error
