name: Build

on:
  push:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb xauth glslang-tools
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON 2>&1 | tee configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
      - name: Prepare Linux artifact
        run: |
          set -o pipefail
          {
            mkdir -p dist/src
            cp -R src/shaders dist/src/
            cp build/build dist/learnopengl
          } 2>&1 | tee package.log
      - name: Test Linux artifact
        run: xvfb-run -a python3 .github/scripts/test_artifact.py --binary dist/learnopengl --shader-dir dist/src/shaders --runtime-directory dist --runtime-smoke-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-linux
          path: dist/
          if-no-files-found: error
      - name: Upload Linux build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-linux-logs
          path: |
            configure.log
            build.log
            package.log
            test.log
          if-no-files-found: ignore

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader validator
        run: brew install glslang
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -DLEARNOPENGL_FETCH_STATIC_GLFW=ON 2>&1 | tee configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
      - name: Prepare macOS artifact
        run: |
          set -o pipefail
          {
            mkdir -p dist/src
            cp -R src/shaders dist/src/
            cp build/build dist/learnopengl
          } 2>&1 | tee package.log
      - name: Test macOS artifact (binary and shaders)
        run: python3 .github/scripts/test_artifact.py --binary dist/learnopengl --shader-dir dist/src/shaders
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-macos
          path: dist/
          if-no-files-found: error
      - name: Upload macOS build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-macos-logs
          path: |
            configure.log
            build.log
            package.log
            test.log
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-glslang
      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DLEARNOPENGL_FETCH_STATIC_GLFW=ON 2>&1 | tee configure.log
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log
      - name: Prepare Windows artifact
        run: |
          set -o pipefail
          {
            mkdir -p dist/src
            cp -R src/shaders dist/src/
            cp build/build.exe dist/learnopengl.exe
          } 2>&1 | tee package.log
      - name: Test Windows artifact (binary and shaders)
        run: python .github/scripts/test_artifact.py --binary dist/learnopengl.exe --shader-dir dist/src/shaders
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-windows
          path: dist/
          if-no-files-found: error
      - name: Upload Windows build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnopengl-windows-logs
          path: |
            configure.log
            build.log
            package.log
            test.log
          if-no-files-found: ignore
